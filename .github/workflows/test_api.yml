name: Test

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: ./api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: install dependency
        run: bun install
      - name: lint check
        run: bun lint:check
      - name: format check
        run: bun format:check
      - name: run test
        run: bun test:coverage
