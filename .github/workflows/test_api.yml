name: Test

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: ./api

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: install dependency
        run: bun install --frozen-lockfile
      - name: check type
        run: bun type:check
      - name: check format
        run: bun format:check
      - name: check lint
        run: bun lint:check
      - name: run test
        run: bun test:coverage
